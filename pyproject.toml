[project]
name = "cli-coffee"
version = "0.1.0"
description = "Keep an Apple Silicon Mac awake, with style — a live machine, network, battery and clock dashboard."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [
    { name = "Bhaskar Bhaumik", email = "4145672+bhaskarbhaumik@users.noreply.github.com" },
]
keywords = ["macos", "apple-silicon", "caffeinate", "pmset", "dashboard", "cli", "rich"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "psutil>=7.0.0",
    "pytz>=2025.2",
    "rich>=14.0.0",
    "rich-argparse-plus>=0.3.1.4",
]

[project.urls]
Homepage = "https://github.com/bhaskarbhaumik/cli-coffee"
Repository = "https://github.com/bhaskarbhaumik/cli-coffee"
Issues = "https://github.com/bhaskarbhaumik/cli-coffee/issues"

[project.scripts]
coffee = "coffee.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "coffee"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "UP042"]

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true
