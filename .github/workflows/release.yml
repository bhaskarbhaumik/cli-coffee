name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  verify:
    name: Verify the tag
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: The tag matches the project version
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="$(make version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match pyproject version $version"
            exit 1
          fi
          echo "$tag matches pyproject version $version"

      - name: VERSION.md agrees with pyproject.toml
        run: make version-check

      - name: The changelog mentions this version
        run: |
          version="${{ steps.version.outputs.version }}"
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi

      - name: Full test suite
        run: make ci

  publish:
    name: Build and publish
    needs: verify
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Build wheel and sdist
        run: uv build --out-dir dist

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 ./* | tee SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "coffee ${TAG}" \
            --generate-notes \
            --verify-tag

      - name: Upload artefacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ needs.verify.outputs.version }}
          path: dist/*
          if-no-files-found: error
