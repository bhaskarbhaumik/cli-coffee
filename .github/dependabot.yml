version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "build"
    labels: ["dependencies"]
    groups:
      python:
        patterns: ["*"]
